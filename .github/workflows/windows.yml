name: Windows build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and publish one executable
        shell: pwsh
        run: |
          dotnet publish LunaDesktop.csproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP/11toXP-publish" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/11toXP-publish" -Force)
          if ($files.Count -ne 1 -or $files[0].Name -cne '11toXP.exe' -or $files[0].PSIsContainer) {
            throw 'Expected one published 11toXP.exe.'
          }
          $check = Start-Process -FilePath $files[0].FullName -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Lifecycle self-test failed with exit code $($check.ExitCode)." }
